# Optional Compose override that sources the browser-extension provisioning
# secret from the host shell instead of a file on the ./data bind mount.
# Layer this on top of docker-compose.yml with `-f` so the secret itself
# never appears in `environment:`/`docker inspect`/`compose config` output —
# Compose reads it from M365_PROVISION_SECRET in the host shell and mounts it
# as a file at /run/secrets/m365_provision_secret inside the container
# instead, which M365_PROVISION_SECRET_FILE then points at.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.provision-secret.yml up -d
#
# M365_PROVISION_SECRET must be defined (even empty) or `compose up` refuses
# to start: Compose requires an env-sourced secret's variable to be set. Set
# it in a project .env file (Compose loads that automatically) or export it
# in the shell before running the command above.
#
# Independent of docker-compose.secrets.yml (the master-passphrase override):
# layer in either, both, or neither depending on which features you want.
services:
  m365bridge:
    environment:
      M365_PROVISION_SECRET_FILE: /run/secrets/m365_provision_secret
    secrets:
      - source: provision_secret
        target: m365_provision_secret

secrets:
  provision_secret:
    environment: M365_PROVISION_SECRET
