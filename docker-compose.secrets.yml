# Optional Compose override that encrypts cached tokens at rest. Layer this on
# top of docker-compose.yml with `-f` so the passphrase itself never appears in
# `environment:`/`docker inspect`/`compose config` output — Compose reads it
# from M365_MASTER_PASSPHRASE_VALUE in the host shell and mounts it as a file
# at /run/secrets/m365_master_passphrase inside the container instead.
#
# Usage:
#   scripts/with-passphrase.sh docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# M365_MASTER_PASSPHRASE_VALUE must be defined (the with-passphrase wrapper
# scripts do this) or `compose up` refuses to start: Compose requires an
# env-sourced secret's variable to be set, even to an empty string.
services:
  m365bridge:
    environment:
      M365_MASTER_PASSPHRASE_FILE: /run/secrets/m365_master_passphrase
    secrets:
      - source: master_passphrase
        target: m365_master_passphrase

secrets:
  master_passphrase:
    environment: M365_MASTER_PASSPHRASE_VALUE
